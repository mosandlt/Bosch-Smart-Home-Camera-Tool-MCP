name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Run tests
        run: |
          pytest tests/ -ra --tb=short \
            --cov=src/bosch_camera_mcp --cov-report=term-missing --cov-fail-under=96

      - name: pip-audit (runtime dependency CVEs)
        run: |
          pip install pip-audit
          # Scoped to requirements.txt (the runtime-only manifest, mirrors
          # pyproject.toml [project.dependencies]) so a CVE in a test-only
          # tool (pytest/responses/freezegun/...) never reds this gate for a
          # dependency that doesn't ship in the published package.
          pip-audit -r requirements.txt

  lint:
    name: ruff + mypy + pylint + codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          pip install ruff mypy pylint codespell

      - name: ruff lint
        run: ruff check src/ tests/

      - name: mypy (strict via pyproject)
        run: mypy src/bosch_camera_mcp/

      - name: pylint
        run: pylint src/bosch_camera_mcp/

      - name: codespell
        run: codespell
