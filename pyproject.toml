[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bosch-smart-home-camera-mcp"
version = "1.5.4"
description = "Model Context Protocol server for Bosch Smart Home cameras"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "mosandlt" }]
keywords = ["mcp", "bosch", "smart-home", "camera", "claude"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "requests>=2.31",
    "urllib3>=2.0",
    "httpx>=0.27",
    "defusedxml>=0.7.1",
    # Transitive (pulled in by mcp) — pinned to patched releases for security:
    "pyjwt>=2.13.0",     # PYSEC-2026-175/177/178/179
    "starlette>=1.0.1",  # PYSEC-2026-161
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "freezegun>=1.4",
    "aiohttp>=3.9",  # regression tests only (pin the v1.5.1 aiohttp.DigestAuth root cause)
]

[project.scripts]
bosch-smart-home-camera-mcp = "bosch_camera_mcp.server:main"

[project.urls]
Homepage = "https://github.com/mosandlt/Bosch-Smart-Home-Camera-Tool-MCP"
"Bug Tracker" = "https://github.com/mosandlt/Bosch-Smart-Home-Camera-Tool-MCP/issues"
"Sister CLI" = "https://github.com/mosandlt/Bosch-Smart-Home-Camera-Tool-Python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# Sister-CLI modules reached via sys.path injection (Option C) — never pip-installed,
# so they are unresolvable both locally and in CI. defusedxml ships no stubs.
module = ["bosch_camera", "get_token", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true
